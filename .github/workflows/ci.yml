name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.3"
      - name: Install the pinned package manager
        run: npm install --global pnpm@8.15.4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile contracts and build the application
        run: pnpm build
      - name: Typecheck contract tooling
        run: pnpm --filter @base-dapp/contracts exec tsc --noEmit
